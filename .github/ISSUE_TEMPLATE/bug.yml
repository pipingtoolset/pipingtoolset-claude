name: Bug report
description: A skill gave a wrong or unexpected result, or would not run.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please leave out project names, client names and anything confidential;
        the numbers needed to reproduce the result are enough.
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The skill you ran, the prompt or inputs, and the units and code edition you gave it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What you expected, and the clause or hand check it comes from if you have one.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened. Paste the calc sheet lines or the error text.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin version, and the host you ran it in (Claude Code, Claude desktop, Codex, other).
      placeholder: "0.10.2, Claude Code"
    validations:
      required: true
