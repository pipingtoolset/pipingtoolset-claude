name: ci

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned 2026-10-26: ubuntu-latest rolled to 26.04, for which setup-python has no
    # 3.9 build. 24.04 keeps the 3.9 floor the skill scripts promise under test.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit + golden tests (stdlib only)
        run: python -m unittest discover -s tests -v
      - name: Manifests parse
        run: |
          python -c "import json; json.load(open('.claude-plugin/marketplace.json')); json.load(open('plugins/piping-toolset/.claude-plugin/plugin.json'))"
